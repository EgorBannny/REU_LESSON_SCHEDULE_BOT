services:

  vless_vpn:
    image: ghcr.io/sagernet/sing-box:v1.11.0
    container_name: vless-vpn_client
    restart: always
    volumes:
      - /etc/sing-box/config.json:/etc/sing-box/config.json
    command: run -c /etc/sing-box/config.json

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
      POSTGRES_DB: schedule
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  poller:
    build: .
    command: ["python", "poller.py"]
    environment:
      DATABASE_URL: postgresql://schedule:schedule@db:5432/schedule
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-5}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "bot.py"]
    environment:
      DATABASE_URL: postgresql://schedule:schedule@db:5432/schedule
      BOT_TOKEN: ${BOT_TOKEN}
      HTTP_PROXY: "http://127.0.0.1:2080"
      HTTPS_PROXY: "http://127.0.0.1:2080"
      NO_PROXY: "db,localhost,127.0.0.1"
      NOTIFY_INTERVAL_SECONDS: ${NOTIFY_INTERVAL_SECONDS:-60}
      NOTIFY_LOOKBACK_DAYS: ${NOTIFY_LOOKBACK_DAYS:-2}
    depends_on:
      vless_vpn:
        condition: service_started
      db:
        condition: service_healthy
    network_mode: "service:vless_vpn"
    restart: unless-stopped

volumes:
  pgdata:
