name: CD

on:
  push:
    branches:
         - main
jobs:
  deploy:
    name: Деплой
    runs-on: ubuntu-latest
    steps:
      - name: Выполнить деплой-скрипт на сервере
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Регистрируем эти переменные внутри SSH-экшена
          script: bash ~/REU_LESSON_SCHEDULE_BOT/deploy.sh
